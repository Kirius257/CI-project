name: C++ CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get install -y clang-format
      - name: Check formatting
        run: |
          find src -name "*.cpp" -exec clang-format --dry-run --Werror {} +

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-tidy
        run: sudo apt-get install -y clang-tidy
      - name: Generate compile_commands.json
        run: |
          cmake -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Run clang-tidy
        run: |
          clang-tidy src/*.cpp -p build

  memory-check-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug
          cmake --build build
      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind --fix-missing
      - name: Run Valgrind
        run: valgrind --leak-check=full ./build/examples

  memory-check-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable WSL
        run: |
          wsl --install -d Ubuntu
      - name: Build and run Valgrind via WSL
        run: |
          wsl bash -c "sudo apt-get update && sudo apt-get install -y valgrind cmake g++"
          wsl bash -c "cmake -B build -DCMAKE_BUILD_TYPE=Debug && cmake --build build"
          wsl bash -c "valgrind --leak-check=full ./build/examples"
